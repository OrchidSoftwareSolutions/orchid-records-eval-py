# Runs both apps in containers; nothing is installed on your machine.
# Ports bind to 127.0.0.1 only, so the app isn't reachable from your network.
services:
  server:
    image: python:3.12-slim
    working_dir: /app/server
    volumes:
      - ./server:/app/server
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    command: sh -c "pip install --no-cache-dir -q -r requirements.txt && uvicorn main:app --reload --host 0.0.0.0 --port 8000"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 3s
      retries: 40

  web:
    image: node:20-alpine
    working_dir: /app/web
    volumes:
      - ./web:/app/web
      - /app/web/node_modules
      - /app/web/.next
    environment:
      BACKEND_URL: http://server:8000
      WATCHPACK_POLLING: "true"
    command: sh -c "npm ci && npm run dev -- -H 0.0.0.0"
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      server:
        condition: service_healthy
